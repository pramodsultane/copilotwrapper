[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilotwrapper"
version = "0.1.0"
description = "Clean-room wrapper utilities for AI coding assistant workflows"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["copilotwrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]